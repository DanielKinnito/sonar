[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonar"
version = "0.1.0"
description = "Local-first Acoustic Side-Channel Security & Forensics Suite"
authors = [{ name = "Sonar Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "ffmpeg-python>=0.2.0",
    "pillow>=10.0.0",
    "pytest>=7.4.0",
]

[project.scripts]
sonar = "sonar.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonar*"]
